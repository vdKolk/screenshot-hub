# Builds Screenshot Hub on every change.
#
# - Pull request: build the app and DMG as a check; the DMG is attached to the run as an artifact.
# - Push to main: the "Latest build" pre-release is replaced by a build of that commit.
#   If the tag v<VERSION> does not exist yet, a release for that version is created as well.
#
# Signing and notarization only happen on a push to main, and only when the secrets below are
# set (Settings › Secrets and variables › Actions). Without secrets the releases are
# non-notarized pre-releases.
#   MACOS_CERTIFICATE_P12       Developer ID Application certificate with key, base64 (.p12)
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12 file
#   NOTARY_API_KEY              App Store Connect API key (contents of the .p8 file)
#   NOTARY_KEY_ID               id of that key
#   NOTARY_ISSUER_ID            issuer id of your App Store Connect team

name: Build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Builds of main run one after another so releases do not interleave; a PR build is
# cancelled when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
      dmg: ${{ steps.build.outputs.dmg }}
      notarized: ${{ steps.build.outputs.notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: build.sh counts the commits for the build number.
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version
          xcrun --show-sdk-version

      - name: Set up Developer ID
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$NOTARY_API_KEY" ]; then
            echo "No Developer ID secrets set: the build will not be notarized."
            exit 0
          fi
          # A temporary keychain that only exists during this run.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"

          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ci-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "The certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build app and DMG
        id: build
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          if [ -n "$IDENTITY" ]; then
            SIGN_IDENTITY="$IDENTITY" NOTARY_PROFILE=ci-notary bash build.sh --release
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            bash build.sh --dmg
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=ScreenshotHub-$VERSION.dmg" >> "$GITHUB_OUTPUT"
          plutil -p "Screenshot Hub.app/Contents/Info.plist" | grep -E 'Version|ScreenshotHub'

      - name: Remove keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ steps.build.outputs.dmg }}
          # The DMG itself, not wrapped in a zip.
          archive: false
          retention-days: 14
          if-no-files-found: error

  release:
    name: Update releases
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job may create releases and tags; the job that builds the code may not.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      DMG: ${{ needs.build.outputs.dmg }}
      NOTARIZED: ${{ needs.build.outputs.notarized }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.dmg }}
          path: dist

      - name: Write release notes
        run: |
          SHORT="${SHA:0:7}"
          # The section of CHANGELOG.md for this version.
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md \
            | sed '/./,$!d' > changes.md
          {
            echo "Build of commit $SHORT."
            echo
            if [ "$NOTARIZED" = "true" ]; then
              echo "Signed with a Developer ID and notarized by Apple. Open the DMG and drag Screenshot Hub to Applications."
            else
              echo "**Test build: not notarized.** macOS blocks the app the first time. To open it anyway:"
              echo
              echo "1. Open the DMG and drag Screenshot Hub to Applications."
              echo "2. Start the app and click Done in the alert."
              echo "3. Go to System Settings › Privacy & Security and click Open Anyway for Screenshot Hub."
              echo
              echo "Only for people who know where the app comes from."
            fi
            echo
            echo "Runs on Macs with Apple silicon and macOS 13 or later."
          } > install.md
          { cat install.md; echo; echo "## Changes in $VERSION"; echo; cat changes.md; } > notes-version.md
          { echo "The newest build of main. Replaced on every change."; echo; cat install.md; } > notes-latest.md

      - name: Replace latest build
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build "dist/$DMG" --prerelease --latest=false \
            --target "$SHA" --title "Latest build ($VERSION, ${SHA:0:7})" --notes-file notes-latest.md

      - name: Release for this version
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; bump VERSION for a new release."
            exit 0
          fi
          if [ "$NOTARIZED" = "true" ]; then
            KIND=(--latest)
          else
            KIND=(--prerelease)
          fi
          gh release create "v$VERSION" "dist/$DMG" "${KIND[@]}" \
            --target "$SHA" --title "Screenshot Hub $VERSION" --notes-file notes-version.md
